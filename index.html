<!DOCTYPE html>
<html lang="id" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KEVNAI STORE | Premium Digital Boutique</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700,800,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400,500,600,700,800&family=JetBrains+Mono:wght@500,600,700,800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 
                        heading: ['Clash Display', 'sans-serif'], 
                        body: ['Plus Jakarta Sans', 'sans-serif'], 
                        mono: ['JetBrains Mono', 'monospace'] 
                    },
                    colors: { 
                        kvn: { 
                            orange: '#FF6A00', 
                            dark: '#09090B', 
                            surface: '#121215', 
                            card: '#18181C', 
                            light: '#F8F9FA', 
                            gray: '#A1A1AA' 
                        } 
                    },
                    boxShadow: { 
                        'soft-3d': '0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08)',
                        'orange-3d': '0 20px 45px -15px rgba(255, 106, 0, 0.28), 0 0 0 1px rgba(255, 106, 0, 0.4)',
                        'tactile': '0 4px 0 0 #000000',
                        'tactile-lg': '0 6px 0 0 #000000'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body id="app-root" class="font-body antialiased selection:bg-kvn-orange selection:text-black">
    <script src="main.js"></script>
</body>
</html>
